name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: Samudini-Chamodya/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, repositories, activity, community, metadata
          config_timezone: Asia/Colombo
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css
          plugin_languages_threshold: 1%
          plugin_lines: yes
          plugin_topics: yes
